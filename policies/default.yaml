version: 1
default_action: deny            # unknown tag -> deny (fail closed); unknown role is rejected outright
# UNREVIEWED = the scanner found nothing and nobody approved the column (PUBLIC, in overrides.yaml): not proven safe
# HEALTH = diagnoses, blood groups, medication: analysts get tokens, so they can count by condition without reading it
# actions: allow | partial | hmac | redact | redact_text (identifiers inside free text)
#        | aggregate (numbers usable only via noisy SUM/AVG/COUNT, see dp:; text is redacted) | deny
roles:
  admin:   {PII_HIGH: allow,   FINANCIAL_CONFIDENTIAL: allow,   PII_MEDIUM: allow,  PII_IN_TEXT: allow,       HEALTH: allow, UNREVIEWED: allow}
  support: {PII_HIGH: partial, FINANCIAL_CONFIDENTIAL: partial, PII_MEDIUM: allow,  PII_IN_TEXT: redact_text, HEALTH: redact, UNREVIEWED: redact}
  analyst: {PII_HIGH: hmac,    FINANCIAL_CONFIDENTIAL: aggregate, PII_MEDIUM: redact, PII_IN_TEXT: redact,    HEALTH: hmac, UNREVIEWED: redact}
  auditor: {PII_HIGH: redact,  FINANCIAL_CONFIDENTIAL: redact,  PII_MEDIUM: redact, PII_IN_TEXT: redact,      HEALTH: redact, UNREVIEWED: redact}
# What each role may do besides querying. The API and CLI check these; nothing here can unmask data.
role_info:
  admin:
    label: Admin
    description: Data owner. Sees real values; runs scans, edits policy, manages threat blocks. Every action is audited.
    capabilities: [query, policy.read, policy.write, registry.read, scan.run, audit.read, integrity.verify,
                   integrity.baseline, threats.manage, pia.read]
  support:
    label: Support agent
    description: Helps customers. Sees partial identifiers (last 4 digits) and rounded balances; never frozen accounts.
    capabilities: [query]
  analyst:
    label: Analyst
    description: Studies trends. Identifiers become joinable HMAC tokens; money only through noisy aggregates.
    capabilities: [query]
  auditor:
    label: Auditor
    description: Reviews controls. Reads policies, scanner evidence, the audit log and integrity proofs; no raw PII.
    capabilities: [query, policy.read, registry.read, audit.read, integrity.verify, pia.read]
# Row-level security: rows outside a role's scope never enter its masked view. Column-vs-literal predicates only.
row_filters:
  support:
    accounts: "status <> 'frozen'"     # frozen accounts are handled by the fraud desk, not first-line support
max_rows: {admin: 10000, support: 100, analyst: 1000, auditor: 100}
min_group_size: {support: 5, analyst: 5, auditor: 5}   # aggregates over fewer rows are suppressed
partial:                        # characters kept at each end; separators are preserved
  card:    {prefix: 4, suffix: 4}
  ssn:     {prefix: 0, suffix: 4}
  aadhaar: {prefix: 0, suffix: 4}
  pan:     {prefix: 2, suffix: 1}
  phone:   {prefix: 0, suffix: 4}
  iban:    {prefix: 4, suffix: 4}
  gstin:   {prefix: 2, suffix: 1}     # state code visible
  passport: {prefix: 0, suffix: 3}
  voter_id: {prefix: 0, suffix: 3}
  bank_account: {prefix: 0, suffix: 4}
  ifsc:    {prefix: 4, suffix: 0}     # bank code visible, branch hidden
  pincode: {prefix: 3, suffix: 0}     # sorting district only
  vehicle_reg: {prefix: 2, suffix: 0} # state only
  dob:     {prefix: 0, suffix: 0}     # separators kept, digits hidden
  name:    {prefix: 1, suffix: 0}
  address: {prefix: 0, suffix: 0}
  default: {prefix: 0, suffix: 2}
bucket_size: 10000              # partial masking of numbers = round down to this bucket
hmac:                           # the `hmac` action: keyed pseudonyms (not anonymous; the key is MASKGUARD_HMAC_KEY)
  length: 32                    # hex characters: 32 = 128 bits (16 = 64 bits, the 1.0.x length)
  scope: global                 # global: equal values match across tables (joins work); column: per-column tokens
threat:                         # insider-threat engine (rules + IsolationForest over each user's query stream)
  enabled: true
  ml: true
  alert: 70                     # risk 0-100: log + dashboard alert
  block: 90                     # block the user for block_minutes
  block_minutes: 15
dp:                             # differential privacy for the `aggregate` action
  epsilon_per_query: 0.5        # per protected aggregate column in a query
  daily_budget: 10.0            # per user per day
  bounds:                       # clip range per column; bounds each person's influence on a SUM
    balance: [0, 1000000]
    amount: [0, 1000000]
    default: [0, 1000000]
