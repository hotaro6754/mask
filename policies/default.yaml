version: 1
default_action: deny            # unknown tag -> deny (fail closed); unknown role is rejected outright
# actions: allow | partial | hmac | redact | redact_text (identifiers inside free text) | deny
roles:
  admin:   {PII_HIGH: allow,   FINANCIAL_CONFIDENTIAL: allow,   PII_MEDIUM: allow,  PII_IN_TEXT: allow}
  support: {PII_HIGH: partial, FINANCIAL_CONFIDENTIAL: partial, PII_MEDIUM: allow,  PII_IN_TEXT: redact_text}
  analyst: {PII_HIGH: hmac,    FINANCIAL_CONFIDENTIAL: redact,  PII_MEDIUM: redact, PII_IN_TEXT: redact}
max_rows: {admin: 10000, support: 100, analyst: 1000}
min_group_size: {support: 5, analyst: 5}   # aggregates over fewer rows are suppressed
partial:                        # characters kept at each end; separators are preserved
  card:    {prefix: 4, suffix: 4}
  ssn:     {prefix: 0, suffix: 4}
  aadhaar: {prefix: 0, suffix: 4}
  pan:     {prefix: 2, suffix: 1}
  phone:   {prefix: 0, suffix: 4}
  iban:    {prefix: 4, suffix: 4}
  gstin:   {prefix: 2, suffix: 1}     # state code visible
  passport: {prefix: 0, suffix: 3}
  voter_id: {prefix: 0, suffix: 3}
  bank_account: {prefix: 0, suffix: 4}
  ifsc:    {prefix: 4, suffix: 0}     # bank code visible, branch hidden
  pincode: {prefix: 3, suffix: 0}     # sorting district only
  vehicle_reg: {prefix: 2, suffix: 0} # state only
  dob:     {prefix: 0, suffix: 0}     # separators kept, digits hidden
  name:    {prefix: 1, suffix: 0}
  address: {prefix: 0, suffix: 0}
  default: {prefix: 0, suffix: 2}
bucket_size: 10000              # partial masking of numbers = round down to this bucket
