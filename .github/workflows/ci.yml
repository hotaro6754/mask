name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: maskguard, POSTGRES_DB: bank}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: maskguard, MYSQL_DATABASE: bank}
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pmaskguard" --health-interval 3s --health-retries 40
    env:
      MASKGUARD_HMAC_KEY: ci-only-hmac-key
      MASKGUARD_JWT_SECRET: ci-only-jwt-secret-0123456789-0123456789
      MASKGUARD_TEST_PG: postgresql://postgres:maskguard@127.0.0.1:5432/bank
      MASKGUARD_TEST_MYSQL: mysql://root:maskguard@127.0.0.1:3306/bank
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: uv sync
      - name: Tests on SQLite, PostgreSQL and MySQL
        run: uv run pytest -q
      - name: Attack suite must report zero leaks
        run: uv run maskguard attack -u analyst.ali -p analyst123
      - name: Security regression (attack suite per role + integrity proof)
        run: uv run maskguard test
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Postman collection against a live API (Newman)
        # Start the API from the synced venv, not `uv run`: a live `uv run` holds uv's cache lock, and setup-uv's
        # post-job `uv cache prune` then waits on it until it times out and fails the job. Stop it on exit too.
        run: |
          MASKGUARD_DB=sqlite:///$RUNNER_TEMP/newman.db MASKGUARD_SEED_IF_EMPTY=1 MASKGUARD_AUDIT=$RUNNER_TEMP/a.jsonl MASKGUARD_REGISTRY=$RUNNER_TEMP/r.yaml \
            .venv/bin/maskguard serve --port 8000 > $RUNNER_TEMP/api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          npx -y newman@6 run postman/Smart-Data-Masking.postman_collection.json -e postman/Local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export newman.xml

  e2e:
    # The built wheel in fresh containers (PostgreSQL 16 + python:3.12), on a database that isn't the demo, in
    # production mode: discovery, review, masking per role, bypass attempts, refusals, proofs, HTTPS API, restarts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel -o dist
      - name: End-to-end in isolated containers
        run: scripts/e2e/run.sh dist/maskguard-*-py3-none-any.whl
