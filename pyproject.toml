[project]
name = "maskguard"
version = "0.1.0"
description = "Query-time PII masking gateway"
requires-python = ">=3.10"
dependencies = [
    "sqlglot",
    "pyyaml",
    "python-stdnum",
    "faker",
    "psycopg[binary]>=3.3.6",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.1",
    "streamlit>=1.65.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.7.0",
    "numpy>=2.2.6",
    "joblib>=1.6.0",
    "pymysql>=1.2.3",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
maskguard = "maskguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maskguard"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
