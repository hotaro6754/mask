[project]
name = "maskguard"
version = "1.0.0"
description = "AI-powered PII discovery and query-time, role-based masking gateway for PostgreSQL, MySQL and SQLite"
readme = "docs/PYPI.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "G. Harshith" },
    { name = "G. Praneeth" },
    { name = "D. Mandeep" },
    { name = "K. Surya Srinivas" },
]
keywords = ["pii", "data-masking", "privacy", "dpdp", "postgresql", "mysql", "security", "gateway", "aadhaar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "sqlglot",
    "pyyaml",
    "python-stdnum",
    "faker",
    "psycopg[binary]>=3.3.6",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.1",
    "streamlit>=1.65.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.7.0",
    "numpy>=2.2.6",
    "joblib>=1.6.0",
    "pymysql>=1.2.3",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
maskguard = "maskguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/hotaro6754/mask"
Documentation = "https://github.com/hotaro6754/mask/blob/claude/zealous-bell-me62fn/docs/GUIDE.md"
Source = "https://github.com/hotaro6754/mask"

[tool.hatch.build.targets.wheel]
packages = ["src/maskguard"]

# The default policy, overrides and demo users ship inside the package so `pip install maskguard` runs anywhere.
[tool.hatch.build.targets.wheel.force-include]
"policies/default.yaml" = "maskguard/policies/default.yaml"
"policies/overrides.yaml" = "maskguard/policies/overrides.yaml"
"policies/public.demo.yaml" = "maskguard/policies/public.demo.yaml"
"policies/users.demo.yaml" = "maskguard/policies/users.demo.yaml"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
