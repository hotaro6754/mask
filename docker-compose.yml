# docker compose up --build  ->  API + Control Room dashboard :8000 (/ui/), classic Streamlit dashboard :8501, PostgreSQL proxy :6543, on PostgreSQL 16.
# MySQL instead: docker compose --profile mysql up --build, with MASKGUARD_DB=mysql://maskguard:maskguard@mysql:3306/bank
# Set real secrets in a .env file (MASKGUARD_HMAC_KEY, MASKGUARD_JWT_SECRET) before any non-demo use.
x-maskguard: &maskguard
  build: .
  environment:
    MASKGUARD_DB: postgresql://maskguard:maskguard@postgres:5432/bank
    MASKGUARD_HMAC_KEY: ${MASKGUARD_HMAC_KEY:-dev-only-hmac-key-change-me}
    MASKGUARD_JWT_SECRET: ${MASKGUARD_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
    MASKGUARD_SCAN_INTERVAL: "300"
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - mgdata:/app/data

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maskguard
      POSTGRES_PASSWORD: maskguard
      POSTGRES_DB: bank
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maskguard -d bank"]
      interval: 2s
      retries: 30

  dashboard:
    <<: *maskguard
    command: ["maskguard", "dashboard", "--classic", "--port", "8501"]
    ports: ["8501:8501"]

  proxy:                        # psql "host=localhost port=6543 user=support.sam dbname=bank"
    <<: *maskguard
    command: ["maskguard", "proxy", "--host", "0.0.0.0", "--port", "6543"]
    ports: ["6543:6543"]

  api:
    <<: *maskguard
    command: ["maskguard", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]

  mysql:                        # optional third backend
    image: mysql:8.4
    profiles: ["mysql"]
    command: ["--log-bin-trust-function-creators=1"]   # lets the gateway user create its masking functions
    environment:
      MYSQL_ROOT_PASSWORD: maskguard-root
      MYSQL_DATABASE: bank
      MYSQL_USER: maskguard
      MYSQL_PASSWORD: maskguard
    ports: ["3306:3306"]

volumes:
  mgdata:
