[project]
name = "maskguard"
version = "1.1.0"
description = "AI-powered PII discovery and query-time, role-based masking gateway for PostgreSQL, MySQL and SQLite"
readme = "docs/PYPI.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "G. Harshith" },
    { name = "G. Praneeth" },
    { name = "D. Mandeep" },
    { name = "K. Surya Srinivas" },
]
keywords = ["pii", "data-masking", "privacy", "dpdp", "postgresql", "mysql", "security", "gateway", "aadhaar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
]
dependencies = [
    "sqlglot",
    "pyyaml",
    "python-stdnum",
    "faker",
    "psycopg[binary]>=3.3.6",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.1",
    "streamlit>=1.65.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.7.0",
    "numpy>=2.2.6",
    "pymysql>=1.2.3",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
maskguard = "maskguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/hotaro6754/mask"
Documentation = "https://github.com/hotaro6754/mask/blob/claude/zealous-bell-me62fn/docs/GUIDE.md"
Source = "https://github.com/hotaro6754/mask"

[tool.hatch.build.targets.wheel]
packages = ["src/maskguard"]

# The default policy, overrides and demo users ship inside the package so `pip install maskguard` runs anywhere.
[tool.hatch.build.targets.wheel.force-include]
"policies/default.yaml" = "maskguard/policies/default.yaml"
"policies/overrides.yaml" = "maskguard/policies/overrides.yaml"
"policies/public.demo.yaml" = "maskguard/policies/public.demo.yaml"
"policies/row_filters.demo.yaml" = "maskguard/policies/row_filters.demo.yaml"
"policies/users.demo.yaml" = "maskguard/policies/users.demo.yaml"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Formatter and linter (TalentAP coding guidelines, rule 1): `uv run ruff format` and `uv run ruff check`.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["training/hf/cache", "training/realworld/cache", "*.md"]  # code in Markdown is documentation

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, bandit (security), blind except, simplifications,
# comprehensions, ruff's own rules
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # line length is the formatter's job; what it leaves long is strings and comments
    "B008",    # typer.Option() / fastapi.Depends() as defaults is how both frameworks declare parameters
    "RUF001",  # "₹", "×" and Devanagari in strings are data, not look-alike characters
]

[tool.ruff.lint.per-file-ignores]
# random draws synthetic data and samples rows; nothing security-relevant is random there (secrets use `secrets`)
"src/maskguard/{ml/synth,seed,threat,dp}.py" = ["S311"]
# the threat simulator writes synthetic queries from integers and random letters, then sends them through the gateway
"src/maskguard/threat_sim.py" = ["S311", "S608"]
# tests: asserts are the point; fixed test passwords, local servers on all interfaces, subprocess on known binaries
"tests/**" = ["S101", "S105", "S106", "S104", "S110", "S112", "S311", "S603", "S607", "S608", "F811"]
# benchmark and training scripts put the source folder on sys.path before importing, and build SQL from fixed text
"{bench,training,scripts}/**" = ["E402", "S311", "S608", "S101"]
# the Postman collection logs in with the documented demo accounts (development only; production refuses them)
"postman/build_collection.py" = ["S105", "S106"]
# the research harness replays attacks against a sandbox and records any failure as an outcome
"docs/research/rea_experiment/harness/*.py" = ["BLE001", "S608", "S311"]
